name: E2E Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Disaster Recovery — snapshot verifier tests
        run: pnpm exec vitest run tests/unit/backup-snapshot-verifier.test.ts

      - name: ITS Sunday torture — unit tests
        run: pnpm exec vitest run tests/unit/its-sunday-torture.test.ts

      - name: ITS Sunday torture — synthetic 500
        run: pnpm exec tsx scripts/verify-test-sunday-synthetic.mjs

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke e2e
        run: pnpm e2e:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
