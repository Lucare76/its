name: Deploy Supabase Migrations

# DISATTIVATO in automatico: le migrazioni si applicano a mano dal SQL Editor
# di Supabase, quindi la cronologia remota (supabase_migrations) non è
# allineata e `db push --include-all` proverebbe a rieseguirle tutte in
# produzione. Fallisce comunque da novembre 2026 (config.toml: `inbucket`
# non più supportato dalla CLI latest). Avvio solo manuale, consapevole.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
