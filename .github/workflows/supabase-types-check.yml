name: Supabase Types Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "lib/supabase/types.ts"
      - "scripts/supabase-gen-types.mjs"
      - ".github/workflows/supabase-types-check.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "lib/supabase/types.ts"
      - "scripts/supabase-gen-types.mjs"
      - ".github/workflows/supabase-types-check.yml"

jobs:
  check-types:
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify generated Supabase types
        run: node scripts/supabase-gen-types.mjs --check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
